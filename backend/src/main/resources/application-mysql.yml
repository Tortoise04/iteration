# MySQL 运行形态：java -jar smart-schedule-1.0.0.jar --spring.profiles.active=mysql
# 默认（不指定 profile）走 application.yml 的内嵌 H2 文件库。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_schedule?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: "root"
    password: "041222"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      # init.sql / schema.sql 只在 mysql profile 下执行
      mode: always
  h2:
    console:
      enabled: false
